<svg id="mainSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background:#070b14; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811"/>
      <stop offset="50%" stop-color="#090d1a"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141c2e" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0a0f1d" stop-opacity="0.98"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
    
    <marker id="arrowCyan" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#c084fc"/>
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Luces Ambientales -->
  <circle cx="250" cy="200" r="320" fill="#0284c7" opacity="0.07" filter="blur(80px)"/>
  <circle cx="960" cy="540" r="400" fill="#7c3aed" opacity="0.05" filter="blur(90px)"/>
  <circle cx="1680" cy="850" r="320" fill="#059669" opacity="0.07" filter="blur(80px)"/>

  <!-- HEADER -->
  <g transform="translate(100, 70)">
    <rect x="0" y="0" width="330" height="34" rx="17" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="18" cy="17" r="5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <text x="36" y="22" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">SYSGET SABER • ARQUITECTURA OFICIAL</text>
    
    <text x="0" y="85" fill="#ffffff" font-size="38" font-weight="900" letter-spacing="-0.5">Ciclo Completo de Evaluación Nacional SIMCE &amp; Analítica Curricular</text>
    <text x="0" y="120" fill="#94a3b8" font-size="17" font-weight="400">Automatización del diagnóstico escolar, impresión facsímil OMR, analítica de brechas y planes remediales PME</text>
  </g>

  <!-- FASE 1: BANCO CURRICULAR -->
  <g transform="translate(90, 240)">
    <rect width="315" height="720" rx="20" fill="url(#cardGradDark)" stroke="#0284c7" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="24" y="24" width="60" height="60" rx="14" fill="url(#cyanGrad)"/>
    <path d="M42 42 L66 42 M42 49 L66 49 M42 56 L58 56 M38 34 L70 34 C72 34 74 36 74 38 L74 68 C74 70 72 72 70 72 L38 72 C36 72 34 70 34 68 L34 38 C34 36 36 34 38 34 Z" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <text x="24" y="125" fill="#38bdf8" font-size="22" font-weight="800">1. Banco Curricular</text>
    <text x="24" y="150" fill="#94a3b8" font-size="13" font-weight="600">MATRICES MINEDUC &amp; AGENCIA</text>
    
    <line x1="24" y1="175" x2="291" y2="175" stroke="#1e293b" stroke-width="1.5"/>

    <rect x="24" y="200" width="267" height="95" rx="12" fill="#0b1329" stroke="#1e293b"/>
    <text x="40" y="232" fill="#ffffff" font-size="14" font-weight="700">Banco de 90+ Preguntas</text>
    <text x="40" y="255" fill="#94a3b8" font-size="12">Ítems estandarizados para 2° Medio y Básica.</text>
    <text x="40" y="275" fill="#38bdf8" font-size="11" font-weight="600">Calibración por dificultad y eje</text>

    <rect x="24" y="310" width="267" height="95" rx="12" fill="#0b1329" stroke="#1e293b"/>
    <text x="40" y="342" fill="#ffffff" font-size="14" font-weight="700">Habilidades Oficiales</text>
    <text x="40" y="365" fill="#94a3b8" font-size="12">• Localizar información</text>
    <text x="40" y="385" fill="#94a3b8" font-size="12">• Interpretar y Relacionar / Reflexionar</text>

    <rect x="24" y="420" width="267" height="95" rx="12" fill="#0b1329" stroke="#1e293b"/>
    <text x="40" y="452" fill="#ffffff" font-size="14" font-weight="700">Aislamiento por Especialidad</text>
    <text x="40" y="475" fill="#94a3b8" font-size="12">Cada docente solo visualiza</text>
    <text x="40" y="495" fill="#94a3b8" font-size="12">sus asignaturas y cursos asignados.</text>

    <rect x="24" y="530" width="267" height="150" rx="12" fill="#0369a1" fill-opacity="0.12" stroke="#0284c7" stroke-dasharray="4 4"/>
    <text x="40" y="565" fill="#38bdf8" font-size="13" font-weight="700">📌 REGLA CURRICULAR</text>
    <text x="40" y="595" fill="#cbd5e1" font-size="12">Cumplimiento estricto de matrices</text>
    <text x="40" y="618" fill="#cbd5e1" font-size="12">oficiales de evaluación SIMCE</text>
    <text x="40" y="641" fill="#cbd5e1" font-size="12">y estándares DEMRE PAES.</text>
  </g>

  <!-- FLECHA 1 -> 2 -->
  <path d="M 415 600 L 445 600" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowCyan)"/>

  <!-- FASE 2: CENTRO DE IMPRESIÓN PDF -->
  <g transform="translate(450, 240)">
    <rect width="315" height="720" rx="20" fill="url(#cardGradDark)" stroke="#7c3aed" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="24" y="24" width="60" height="60" rx="14" fill="url(#purpleGrad)"/>
    <path d="M40 45 L68 45 M40 53 L68 53 M44 35 L64 35 L64 42 L44 42 Z M44 56 L64 56 L64 68 L44 68 Z M36 42 L72 42 C74 42 76 44 76 46 L76 60 C76 62 74 64 72 64 L36 64 C34 64 32 62 32 60 L32 46 C32 44 34 42 36 42 Z" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <text x="24" y="125" fill="#c084fc" font-size="22" font-weight="800">2. Centro Impresión</text>
    <text x="24" y="150" fill="#94a3b8" font-size="13" font-weight="600">GENERACIÓN AISLADA DE PDF</text>
    
    <line x1="24" y1="175" x2="291" y2="175" stroke="#1e293b" stroke-width="1.5"/>

    <rect x="24" y="200" width="267" height="95" rx="12" fill="#170c2e" stroke="#1e293b"/>
    <text x="40" y="232" fill="#ffffff" font-size="14" font-weight="700">Cuadernillo Facsímil</text>
    <text x="40" y="255" fill="#94a3b8" font-size="12">Membrete institucional oficial,</text>
    <text x="40" y="275" fill="#c084fc" font-size="11" font-weight="600">tipografía nítida y formato examen</text>

    <rect x="24" y="310" width="267" height="95" rx="12" fill="#170c2e" stroke="#1e293b"/>
    <text x="40" y="342" fill="#ffffff" font-size="14" font-weight="700">Hoja OMR 1 Sola Página</text>
    <text x="40" y="365" fill="#94a3b8" font-size="12">Optimizado para fotocopiado masivo</text>
    <text x="40" y="385" fill="#94a3b8" font-size="12">sin desbordes ni saltos en blanco.</text>

    <rect x="24" y="420" width="267" height="95" rx="12" fill="#170c2e" stroke="#1e293b"/>
    <text x="40" y="452" fill="#ffffff" font-size="14" font-weight="700">Pautas &amp; Rúbricas Docentes</text>
    <text x="40" y="475" fill="#94a3b8" font-size="12">Claves de respuestas y criterios</text>
    <text x="40" y="495" fill="#94a3b8" font-size="12">de evaluación de preguntas abiertas.</text>

    <rect x="24" y="530" width="267" height="150" rx="12" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-dasharray="4 4"/>
    <text x="40" y="565" fill="#c084fc" font-size="13" font-weight="700">⚙️ MOTOR ZERO-LEAKAGE</text>
    <text x="40" y="595" fill="#cbd5e1" font-size="12">Montaje en React Portal aislado,</text>
    <text x="40" y="618" fill="#cbd5e1" font-size="12">ocultamiento total del DOM</text>
    <text x="40" y="641" fill="#cbd5e1" font-size="12">y título dinámico para guardar PDF.</text>
  </g>

  <!-- FLECHA 2 -> 3 -->
  <path d="M 775 600 L 805 600" fill="none" stroke="#c084fc" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowPurple)"/>

  <!-- FASE 3: APLICACIÓN EN SALA / ONLINE -->
  <g transform="translate(810, 240)">
    <rect width="315" height="720" rx="20" fill="url(#cardGradDark)" stroke="#d97706" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="24" y="24" width="60" height="60" rx="14" fill="url(#amberGrad)"/>
    <path d="M54 36 A18 18 0 1 1 54 72 A18 18 0 1 1 54 36 Z M54 44 L54 54 L62 58 M54 30 L54 34 M48 30 L60 30" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <text x="24" y="125" fill="#fbbf24" font-size="22" font-weight="800">3. Aplicación Sala/Web</text>
    <text x="24" y="150" fill="#94a3b8" font-size="13" font-weight="600">DOBLE MODALIDAD DE RENDICIÓN</text>
    
    <line x1="24" y1="175" x2="291" y2="175" stroke="#1e293b" stroke-width="1.5"/>

    <rect x="24" y="200" width="267" height="95" rx="12" fill="#241505" stroke="#1e293b"/>
    <text x="40" y="232" fill="#ffffff" font-size="14" font-weight="700">Rendición Presencial (OMR)</text>
    <text x="40" y="255" fill="#94a3b8" font-size="12">Aplicación tradicional con lápiz</text>
    <text x="40" y="275" fill="#fbbf24" font-size="11" font-weight="600">y cuadernillo facsímil impreso</text>

    <rect x="24" y="310" width="267" height="95" rx="12" fill="#241505" stroke="#1e293b"/>
    <text x="40" y="342" fill="#ffffff" font-size="14" font-weight="700">Runner Digital Online</text>
    <text x="40" y="365" fill="#94a3b8" font-size="12">Interfaz interactiva para estudiantes,</text>
    <text x="40" y="385" fill="#94a3b8" font-size="12">cronómetro oficial y guardado.</text>

    <rect x="24" y="420" width="267" height="95" rx="12" fill="#241505" stroke="#1e293b"/>
    <text x="40" y="452" fill="#ffffff" font-size="14" font-weight="700">Aislamiento de Ambientes</text>
    <text x="40" y="475" fill="#94a3b8" font-size="12">Sandbox (Liceo Bicentenario)</text>
    <text x="40" y="495" fill="#94a3b8" font-size="12">vs Producción Real (RBD 31030-1)</text>

    <rect x="24" y="530" width="267" height="150" rx="12" fill="#d97706" fill-opacity="0.12" stroke="#d97706" stroke-dasharray="4 4"/>
    <text x="40" y="565" fill="#fbbf24" font-size="13" font-weight="700">🔒 SEGURIDAD DE DATOS</text>
    <text x="40" y="595" fill="#cbd5e1" font-size="12">Separación estricta de base de datos:</text>
    <text x="40" y="618" fill="#cbd5e1" font-size="12">las pruebas demo jamás contaminan</text>
    <text x="40" y="641" fill="#cbd5e1" font-size="12">los registros reales del colegio.</text>
  </g>

  <!-- FLECHA 3 -> 4 -->
  <path d="M 1135 600 L 1165 600" fill="none" stroke="#fbbf24" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>

  <!-- FASE 4: CORRECCIÓN & ANALÍTICA SIMCE -->
  <g transform="translate(1170, 240)">
    <rect width="315" height="720" rx="20" fill="url(#cardGradDark)" stroke="#059669" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="24" y="24" width="60" height="60" rx="14" fill="url(#emeraldGrad)"/>
    <path d="M38 64 L46 64 L46 48 L38 48 Z M50 64 L58 64 L58 36 L50 36 Z M62 64 L70 64 L70 42 L62 42 Z M34 68 L74 68" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <text x="24" y="125" fill="#34d399" font-size="22" font-weight="800">4. Analítica SIMCE</text>
    <text x="24" y="150" fill="#94a3b8" font-size="13" font-weight="600">ESCALA OFICIAL 100 A 350 PTS</text>
    
    <line x1="24" y1="175" x2="291" y2="175" stroke="#1e293b" stroke-width="1.5"/>

    <rect x="24" y="200" width="267" height="95" rx="12" fill="#042116" stroke="#1e293b"/>
    <text x="40" y="232" fill="#ffffff" font-size="14" font-weight="700">Corrección Instantánea</text>
    <text x="40" y="255" fill="#94a3b8" font-size="12">Lectura de respuestas OMR</text>
    <text x="40" y="275" fill="#34d399" font-size="11" font-weight="600">y cálculo automático de puntajes</text>

    <rect x="24" y="310" width="267" height="95" rx="12" fill="#042116" stroke="#1e293b"/>
    <text x="40" y="342" fill="#ffffff" font-size="14" font-weight="700">Mapas de Calor Curriculares</text>
    <text x="40" y="365" fill="#94a3b8" font-size="12">Desglose visual por Habilidad,</text>
    <text x="40" y="385" fill="#94a3b8" font-size="12">Eje Temático y nivel de logro.</text>

    <rect x="24" y="420" width="267" height="95" rx="12" fill="#042116" stroke="#1e293b"/>
    <text x="40" y="452" fill="#ffffff" font-size="14" font-weight="700">Línea Base Histórica</text>
    <text x="40" y="475" fill="#94a3b8" font-size="12">Comparación con datos 2016-2025</text>
    <text x="40" y="495" fill="#94a3b8" font-size="12">de la Agencia de Calidad de la Educ.</text>

    <rect x="24" y="530" width="267" height="150" rx="12" fill="#059669" fill-opacity="0.12" stroke="#059669" stroke-dasharray="4 4"/>
    <text x="40" y="565" fill="#34d399" font-size="13" font-weight="700">📊 NIVELES DE LOGRO</text>
    <text x="40" y="595" fill="#cbd5e1" font-size="12">• Adecuado (&gt; 270 pts)</text>
    <text x="40" y="618" fill="#cbd5e1" font-size="12">• Elemental (220 - 269 pts)</text>
    <text x="40" y="641" fill="#cbd5e1" font-size="12">• Insuficiente (&lt; 220 pts)</text>
  </g>

  <!-- FLECHA 4 -> 5 -->
  <path d="M 1495 600 L 1525 600" fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrowEmerald)"/>

  <!-- FASE 5: PLANES REMEDIALES & PME -->
  <g transform="translate(1530, 240)">
    <rect width="300" height="720" rx="20" fill="url(#cardGradDark)" stroke="#e11d48" stroke-width="2" filter="url(#cardShadow)"/>
    <rect x="24" y="24" width="60" height="60" rx="14" fill="url(#roseGrad)"/>
    <path d="M38 38 L62 38 C64 38 66 40 66 42 L66 66 C66 68 64 70 62 70 L38 70 C36 70 34 68 34 66 L34 42 C34 40 36 38 38 38 Z M42 46 L58 46 M42 53 L58 53 M42 60 L52 60 M66 54 L72 58 L72 70 L66 66" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <text x="24" y="125" fill="#fb7185" font-size="22" font-weight="800">5. Planes Remediales</text>
    <text x="24" y="150" fill="#94a3b8" font-size="13" font-weight="600">REFORZAMIENTO FOCALIZADO</text>
    
    <line x1="24" y1="175" x2="276" y2="175" stroke="#1e293b" stroke-width="1.5"/>

    <rect x="24" y="200" width="252" height="95" rx="12" fill="#290710" stroke="#1e293b"/>
    <text x="40" y="232" fill="#ffffff" font-size="14" font-weight="700">Fichas por Estudiante</text>
    <text x="40" y="255" fill="#94a3b8" font-size="12">Diagnóstico individualizado con</text>
    <text x="40" y="275" fill="#fb7185" font-size="11" font-weight="600">preguntas de refuerzo dirigidas</text>

    <rect x="24" y="310" width="252" height="95" rx="12" fill="#290710" stroke="#1e293b"/>
    <text x="40" y="342" fill="#ffffff" font-size="14" font-weight="700">Detección de Brechas</text>
    <text x="40" y="365" fill="#94a3b8" font-size="12">Identificación de reactivos críticos</text>
    <text x="40" y="385" fill="#94a3b8" font-size="12">con menos del 50% de acierto.</text>

    <rect x="24" y="420" width="252" height="95" rx="12" fill="#290710" stroke="#1e293b"/>
    <text x="40" y="452" fill="#ffffff" font-size="14" font-weight="700">Reportes Directivos UTP</text>
    <text x="40" y="475" fill="#94a3b8" font-size="12">Evidencia pedagógica para planes</text>
    <text x="40" y="495" fill="#94a3b8" font-size="12">de mejoramiento educativo (PME).</text>

    <rect x="24" y="530" width="252" height="150" rx="12" fill="#e11d48" fill-opacity="0.12" stroke="#e11d48" stroke-dasharray="4 4"/>
    <text x="40" y="565" fill="#fb7185" font-size="13" font-weight="700">🎯 IMPACTO INSTITUCIONAL</text>
    <text x="40" y="595" fill="#cbd5e1" font-size="12">Cierre efectivo de brechas</text>
    <text x="40" y="618" fill="#cbd5e1" font-size="12">curriculares previo a la rendición</text>
    <text x="40" y="641" fill="#cbd5e1" font-size="12">oficial SIMCE y PAES 2026.</text>
  </g>
</svg>
