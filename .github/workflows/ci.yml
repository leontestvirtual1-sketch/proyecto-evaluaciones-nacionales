name: CI - Sysget Saber

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Typecheck, Build & Multitenant Contract Verification
    runs-on: ubuntu-latest

    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      APP_URL: https://sysget-saber.vercel.app

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Strict TypeScript Compilation (Directiva 6)
        run: npx tsc --noEmit

      - name: Code Quality & Linting
        run: npm run lint

      - name: Vite Production Build
        run: npm run build

      - name: Run Multitenant Isolation & Schema Tests
        run: |
          npx tsx tests/tenant-isolation.test.ts
          npx tsx tests/grade-evaluation.test.ts

