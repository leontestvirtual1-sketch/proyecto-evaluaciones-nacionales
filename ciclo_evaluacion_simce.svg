<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background:#0b0f19; font-family:'Inter', system-ui, -apple-system, sans-serif;">
  <defs>
    <!-- Gradientes de Fondo y Tarjetas -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>

    <linearGradient id="cardGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>

    <!-- Filtros de Resplandor Glow -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <!-- Marcadores de Flechas -->
    <marker id="arrowCyan" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#a855f7"/>
    </marker>
    <marker id="arrowEmerald" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Fondo -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>

  <!-- Cuadrícula Decorativa de Fondo -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40"/>
    </pattern>
    <rect width="1920" height="1080" fill="url(#grid)"/>
  </g>

  <!-- Luces Ambientales de Fondo -->
  <circle cx="200" cy="180" r="280" fill="#0284c7" opacity="0.08" filter="blur(60px)"/>
  <circle cx="960" cy="540" r="350" fill="#7c3aed" opacity="0.06" filter="blur(80px)"/>
  <circle cx="1700" cy="850" r="280" fill="#059669" opacity="0.08" filter="blur(60px)"/>

  <!-- ==================== HEADER PRINCIPAL ==================== -->
  <g transform="translate(100, 60)">
    <!-- Badge de Arquitectura -->
    <rect x="0" y="0" width="220" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="16" cy="16" r="5" fill="#38bdf8" filter="url(#glowCyan)"/>
    <text x="32" y="21" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="1.5">ARQUITECTURA OFICIAL</text>

    <!-- Título Principal -->
    <text x="0" y="75" fill="#f8fafc" font-size="34" font-weight="800" letter-spacing="-0.5">Ciclo de Evaluación y Control de Asistencia SIMCE</text>
    <text x="0" y="105" fill="#94a3b8" font-size="16" font-weight="400">Flujo de Alta Velocidad (Kiosko en Portería, Verificación Biométrica, Supabase Postgres y Despacho Asíncrono)</text>
  </g>

  <!-- ==================== NIVEL 1: ENTRADA KIOSKO EN PORTERÍA ==================== -->
  <!-- Contenedor Maestro Kiosko -->
  <g transform="translate(100, 200)">
    <rect width="1720" height="240" rx="20" fill="url(#cardGradDark)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Encabezado de Sección Kiosko -->
    <rect x="24" y="20" width="340" height="38" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="44" y="45" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="1">🏢 KIOSKO EN PORTERÍA (/marcar)</text>
    <text x="380" y="45" fill="#64748b" font-size="13">Modo Pantalla Completa • Aislamiento Estricto por RBD de Establecimiento</text>

    <!-- Submódulo 1A: Reconocimiento Facial -->
    <g transform="translate(40, 75)">
      <rect width="780" height="135" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="20" y="20" width="46" height="46" rx="10" fill="url(#cyanGrad)"/>
      <!-- Icono Cara / Biometría -->
      <path d="M38 35 C38 41 48 41 48 35 M36 31 A2 2 0 1 1 36 31.01 M50 31 A2 2 0 1 1 50 31.01 M32 25 L32 21 C32 20 33 19 34 19 L38 19 M54 25 L54 21 C54 20 53 19 52 19 L48 19 M32 45 L32 49 C32 50 33 51 34 51 L38 51 M54 45 L54 49 C54 50 53 51 52 51 L48 51" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
      
      <text x="80" y="38" fill="#ffffff" font-size="17" font-weight="700">Canal A: Reconocimiento Facial</text>
      <text x="80" y="58" fill="#38bdf8" font-size="12" font-weight="600">INFERENCIA LOCAL EN BROWSER (WebGL / WASM)</text>
      
      <circle cx="85" cy="85" r="3" fill="#38bdf8"/>
      <text x="96" y="89" fill="#cbd5e1" font-size="13">Procesamiento de embeddings biométricos 100% en el cliente</text>
      
      <circle cx="85" cy="108" r="3" fill="#38bdf8"/>
      <text x="96" y="112" fill="#cbd5e1" font-size="13">Aislamiento por RBD: Compara solo contra personal del establecimiento</text>
    </g>

    <!-- Submódulo 1B: RUT + PIN -->
    <g transform="translate(900, 75)">
      <rect width="780" height="135" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="20" y="20" width="46" height="46" rx="10" fill="url(#purpleGrad)"/>
      <!-- Icono Teclado / PIN -->
      <path d="M34 26 L52 26 C54 26 55 27 55 29 L55 45 C55 47 54 48 52 48 L34 48 C32 48 31 47 31 45 L31 29 C31 27 32 26 34 26 Z M37 32 L39 32 M43 32 L45 32 M49 32 L51 32 M37 38 L39 38 M43 38 L45 38 M49 38 L51 38" stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round"/>
      
      <text x="80" y="38" fill="#ffffff" font-size="17" font-weight="700">Canal B: Ingreso RUT + PIN Seguro</text>
      <text x="80" y="58" fill="#c084fc" font-size="12" font-weight="600">TECLADO VIRTUAL CON RATE LIMITING</text>
      
      <circle cx="85" cy="85" r="3" fill="#c084fc"/>
      <text x="96" y="89" fill="#cbd5e1" font-size="13">Protección activa contra fuerza bruta (bloqueo por intentos fallidos)</text>
      
      <circle cx="85" cy="108" r="3" fill="#c084fc"/>
      <text x="96" y="112" fill="#cbd5e1" font-size="13">Validación de PIN robusto (bloqueo de patrones 1234, años y repetidos)</text>
    </g>
  </g>

  <!-- ==================== LÍNEAS CONECTORAS INTERMEDIAS ==================== -->
  <path d="M 490 440 L 490 490 L 960 490 L 960 520" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowCyan)"/>
  <path d="M 1390 440 L 1390 490 L 960 490" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-dasharray="6 4"/>

  <!-- ==================== NIVEL 2: PROCESAMIENTO & BACKEND ==================== -->
  <g transform="translate(100, 520)">
    <rect width="1720" height="230" rx="20" fill="url(#cardGradDark)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>
    
    <!-- Encabezado de Sección Backend -->
    <rect x="24" y="20" width="370" height="38" rx="8" fill="#0f172a" stroke="#a855f7" stroke-width="1.5"/>
    <text x="44" y="45" fill="#a855f7" font-size="14" font-weight="700" letter-spacing="1">⚙️ SERVIDOR NEXT.JS &amp; SUPABASE POSTGRES</text>
    <text x="410" y="45" fill="#64748b" font-size="13">Procesamiento Central Transaccional • Validación Zod &amp; Georreferenciación</text>

    <!-- Submódulo 2A: Validación & GPS -->
    <g transform="translate(40, 75)">
      <rect width="520" height="125" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="18" y="18" width="42" height="42" rx="10" fill="url(#purpleGrad)"/>
      <!-- Icono Servidor -->
      <path d="M29 32 L49 32 M29 39 L49 39 M29 46 L49 46 M25 25 L53 25 C55 25 56 26 56 28 L56 50 C56 52 55 53 53 53 L25 53 C23 53 22 52 22 50 L22 28 C22 26 23 25 25 25 Z" stroke="#ffffff" stroke-width="2" fill="none"/>
      
      <text x="72" y="36" fill="#ffffff" font-size="16" font-weight="700">API Route /marcar</text>
      <text x="72" y="54" fill="#c084fc" font-size="11" font-weight="600">VALIDACIÓN ESTRICTA &amp; GEO-RADIO</text>
      
      <text x="20" y="85" fill="#cbd5e1" font-size="12.5">• Verificación Haversine con radio del colegio</text>
      <text x="20" y="105" fill="#cbd5e1" font-size="12.5">• Sanitización de entradas y firma de sesión</text>
    </g>

    <!-- Submódulo 2B: Supabase DB Transacción -->
    <g transform="translate(600, 75)">
      <rect width="520" height="125" rx="14" fill="#0f172a" stroke="#065f46" stroke-width="1.5"/>
      <rect x="18" y="18" width="42" height="42" rx="10" fill="url(#emeraldGrad)"/>
      <!-- Icono Base de Datos -->
      <path d="M39 25 C47 25 54 28 54 31 C54 34 47 37 39 37 C31 37 24 34 24 31 C24 28 31 25 39 25 Z M24 31 L24 47 C24 50 31 53 39 53 C47 53 54 50 54 47 L54 31 M24 39 C24 42 31 45 39 45 C47 45 54 42 54 39" stroke="#ffffff" stroke-width="2" fill="none"/>
      
      <text x="72" y="36" fill="#ffffff" font-size="16" font-weight="700">1. Persistencia Postgres (~200ms)</text>
      <text x="72" y="54" fill="#34d399" font-size="11" font-weight="600">INSERCIÓN ATÓMICA DE MARCACIÓN</text>
      
      <text x="20" y="85" fill="#cbd5e1" font-size="12.5">• Generación de Folio Único Oficial</text>
      <text x="20" y="105" fill="#cbd5e1" font-size="12.5">• Timestamp inmutable de base de datos</text>
    </g>

    <!-- Submódulo 2C: Bifurcación Asíncrona -->
    <g transform="translate(1160, 75)">
      <rect width="520" height="125" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="18" y="18" width="42" height="42" rx="10" fill="url(#amberGrad)"/>
      <!-- Icono Lightning / Fork -->
      <path d="M41 24 L29 38 L38 38 L35 52 L49 36 L40 36 Z" stroke="#ffffff" stroke-width="2" fill="#fbbf24"/>
      
      <text x="72" y="36" fill="#ffffff" font-size="16" font-weight="700">Bifurcación Inmediata</text>
      <text x="72" y="54" fill="#fbbf24" font-size="11" font-weight="600">SEPARACIÓN CRÍTICA DE RESPONSABILIDAD</text>
      
      <text x="20" y="85" fill="#cbd5e1" font-size="12.5">• Rama Síncrona: Confirmación UI inmediata</text>
      <text x="20" y="105" fill="#cbd5e1" font-size="12.5">• Rama Asíncrona: Dispatcher de Notificaciones</text>
    </g>
  </g>

  <!-- ==================== LÍNEAS CONECTORAS HACIA FASE FINAL ==================== -->
  <path d="M 500 750 L 500 810" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrowEmerald)"/>
  <path d="M 1420 750 L 1420 810" fill="none" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrowPurple)"/>

  <!-- ==================== NIVEL 3: RESULTADOS & ACCIONES ==================== -->
  <!-- Tarjeta Izquierda: Respuesta Rápida al Kiosko -->
  <g transform="translate(100, 810)">
    <rect width="830" height="210" rx="18" fill="url(#cardGradDark)" stroke="#059669" stroke-width="2" filter="url(#cardShadow)"/>
    
    <rect x="30" y="28" width="52" height="52" rx="12" fill="url(#emeraldGrad)" filter="url(#glowEmerald)"/>
    <!-- Icono Check Grande -->
    <path d="M44 54 L52 62 L68 44" stroke="#ffffff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="100" y="48" fill="#34d399" font-size="13" font-weight="700" letter-spacing="1">⚡ RESPUESTA INMEDIATA (FASE SÍNCRONA)</text>
    <text x="100" y="74" fill="#ffffff" font-size="22" font-weight="800">2. Confirmación al Kiosko en Pantalla</text>
    
    <!-- Tarjeta de Contenido Interno -->
    <rect x="30" y="100" width="770" height="85" rx="10" fill="#064e3b" fill-opacity="0.3" stroke="#059669" stroke-width="1"/>
    
    <text x="50" y="130" fill="#ecfdf5" font-size="14" font-weight="600">🔊 Feedback Auditivo + Visual de Alta Velocidad (&lt; 250ms)</text>
    <text x="50" y="155" fill="#a7f3d0" font-size="13">• Muestra nombre del funcionario, hora oficial y folio sin demorar la fila.</text>
    <text x="50" y="172" fill="#a7f3d0" font-size="13">• La pantalla se resetea automáticamente para el siguiente usuario.</text>
  </g>

  <!-- Tarjeta Derecha: Despacho en Segundo Plano -->
  <g transform="translate(990, 810)">
    <rect width="830" height="210" rx="18" fill="url(#cardGradDark)" stroke="#e11d48" stroke-width="2" filter="url(#cardShadow)"/>
    
    <rect x="30" y="28" width="52" height="52" rx="12" fill="url(#roseGrad)"/>
    <!-- Icono Correo / SMTP -->
    <path d="M44 48 L56 57 L68 48 M42 44 L70 44 C72 44 74 46 74 48 L74 64 C74 66 72 68 70 68 L42 68 C40 68 38 66 38 64 L38 48 C38 46 40 44 42 44 Z" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <text x="100" y="48" fill="#fb7185" font-size="13" font-weight="700" letter-spacing="1">📨 TAREA ASÍNCRONA EN SEGUNDO PLANO</text>
    <text x="100" y="74" fill="#ffffff" font-size="22" font-weight="800">3. Despacho Asíncrono de Colilla</text>
    
    <!-- Tarjeta de Contenido Interno -->
    <rect x="30" y="100" width="770" height="85" rx="10" fill="#4c0519" fill-opacity="0.3" stroke="#e11d48" stroke-width="1"/>
    
    <text x="50" y="130" fill="#fff1f2" font-size="14" font-weight="600">📧 Servicio Gmail SMTP con Timeout Aislado</text>
    <text x="50" y="155" fill="#fecdd3" font-size="13">• Emisión de comprobante digital oficial con firma criptográfica y folio.</text>
    <text x="50" y="172" fill="#fecdd3" font-size="13">• Si la red externa de correo falla, NO interrumpe el flujo de entrada en portería.</text>
  </g>

</svg>
